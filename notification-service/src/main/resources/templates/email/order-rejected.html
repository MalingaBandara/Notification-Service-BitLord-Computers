<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f1a; color: #e2e8f0; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #1a1a2e; border-radius: 12px; overflow: hidden; margin-top: 20px; border: 1px solid rgba(255,255,255,0.08); }
        .header { background-color: #0f0f1a; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .header h1 { color: #e2e8f0; margin: 0; font-size: 24px; }
        .content { padding: 30px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #ef4444; }
        .footer { background-color: #0f0f1a; padding: 15px; text-align: center; font-size: 12px; color: #94a3b8; }
        .cta-button { display: inline-block; background-color: #7c3aed; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 9999px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BITLORD'S COMPUTER PARTS</h1>
        </div>
        <div class="content">
            <div class="title">⚠️ Order Rejected</div>
            <p>Dear Customer,</p>
            <p>Unfortunately, we could not complete your order <strong th:text="${orderId}"></strong> due to insufficient stock for one or more items.</p>
            <p>Please check back later or modify your order.</p>
            <a href="#" class="cta-button">Visit Store</a>
        </div>
        <div class="footer">
            © 2026 Bitlord's Computer Parts
        </div>
    </div>
</body>
</html>
