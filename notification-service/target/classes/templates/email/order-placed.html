<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f1a; color: #e2e8f0; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #1a1a2e; border-radius: 12px; overflow: hidden; margin-top: 20px; border: 1px solid rgba(255,255,255,0.08); }
        .header { background-color: #0f0f1a; padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .header h1 { color: #e2e8f0; margin: 0; font-size: 24px; }
        .content { padding: 30px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #10b981; }
        .summary { background-color: #0f0f1a; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .total { font-weight: bold; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; margin-top: 10px; }
        .footer { background-color: #0f0f1a; padding: 15px; text-align: center; font-size: 12px; color: #94a3b8; }
        .cta-button { display: inline-block; background-color: #7c3aed; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 9999px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BITLORD'S COMPUTER PARTS</h1>
        </div>
        <div class="content">
            <div class="title">✅ Your Order has been Placed</div>
            <p>Dear Customer,</p>
            <p>Your order <strong th:text="${orderId}"></strong> has been placed and is pending stock confirmation.</p>
            
            <div class="summary">
                <div style="margin-bottom:10px; font-weight:bold;">Order Summary</div>
                <div th:each="item : ${items}" class="item">
                    <span th:text="${item.quantity} + 'x ' + ${item.productName}"></span>
                    <span th:text="'$' + ${item.unitPrice}"></span>
                </div>
                <div class="item total">
                    <span>Total</span>
                    <span th:text="'$' + ${totalAmount}"></span>
                </div>
            </div>
            
            <a href="#" class="cta-button">View Order Status</a>
        </div>
        <div class="footer">
            © 2026 Bitlord's Computer Parts
        </div>
    </div>
</body>
</html>
